<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vibe Tycoon</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7b4dff">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--surf:#f3f4f7;--surf2:#e8eaef;--ink:#0e0f12;--mute:#5f6470;--line:#eceef2;
  --acc:#7b4dff;--accfg:#ffffff;--accTxt:#5a2fd9;--accSoft:rgba(255,255,255,.92);--accSoft2:#efe8ff;--ok:#10b265;--red:#ff3b30;
  --sans:"Onest",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));--sb:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{--page:linear-gradient(180deg,#d6c8ff 0%,#b39cff 100%);--pc:#c5b2ff;--on:#1f1147;--onm:rgba(31,17,71,.6);--surf:#ffffff;--tapbg:#f5f0ff;--tapfg:#3b1d9a;--tapsh:0 14px 30px -14px rgba(70,30,170,.55),inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(255,255,255,.55);--hero:linear-gradient(135deg,#f6f2ff,#ffffff);--herofg:#1f1147;--pillbg:rgba(91,47,217,.08);--pillfg:rgba(31,17,71,.62);--topbg:rgba(208,196,255,.88);min-height:100vh;background:var(--page) fixed}
body.th-blue{--page:linear-gradient(180deg,#3a68ff 0%,#2148e0 60%,#1a38c4 100%);--pc:#2550ec;--on:#fff;--onm:rgba(255,255,255,.72);--surf:#fff;--accSoft:rgba(255,255,255,.94);--tapbg:#fff;--tapfg:#2148e0;--tapsh:0 14px 30px -12px rgba(0,0,40,.5);--hero:rgba(255,255,255,.14);--topbg:rgba(46,88,245,.88)}
body.th-lime{--page:#c9f53c;--pc:#c9f53c;--on:#0e0f12;--onm:rgba(14,15,18,.6);--surf:#fff;--acc:#0e0f12;--accSoft:rgba(255,255,255,.8);--tapbg:#0e0f12;--tapfg:#c9f53c;--tapsh:0 14px 30px -12px rgba(0,0,0,.45);--hero:#0e0f12;--topbg:rgba(201,245,60,.9)}
body.th-violet{--page:linear-gradient(180deg,#8257ff 0%,#6a3df0 55%,#5626d6 100%);--pc:#7347f6;--on:#fff;--onm:rgba(255,255,255,.72);--surf:#fff;--acc:#6a3df0;--accSoft:rgba(255,255,255,.94);--tapbg:#fff;--tapfg:#5626d6;--tapsh:0 14px 30px -12px rgba(30,0,80,.5);--hero:rgba(255,255,255,.14);--topbg:rgba(126,83,255,.88)}
body.th-coral{--page:linear-gradient(180deg,#ff7a45 0%,#ff4d4d 55%,#ff3d75 100%);--pc:#ff6248;--on:#fff;--onm:rgba(255,255,255,.78);--surf:#fff;--acc:#ff4b3a;--accSoft:rgba(255,255,255,.94);--tapbg:#0e0f12;--tapfg:#fff;--tapsh:0 14px 30px -12px rgba(0,0,0,.5);--hero:rgba(255,255,255,.16);--topbg:rgba(255,110,70,.9)}
body[class*=th-]::before{display:none}
body[class*=th-] .hero{box-shadow:0 14px 34px -18px rgba(0,0,0,.45)}
body[class*=th-] .hero::after{display:none}
.veil,.mg{--surf:#f3f4f7;--surf2:#e8eaef}
.logo,.sh h3,.back,.cd-top b{color:var(--on)}
.sh small,.hint,.ver,.cd-top p,.legend,.scr>.note{color:var(--onm)}
.logo span{color:var(--onm)}
body:not([class*=th-]) .logo span{color:var(--accTxt)}
.palw{background:var(--surf);padding:14px;border-radius:22px}
.pal{display:flex;gap:10px;flex-wrap:wrap}
.pal button{width:52px;height:52px;border-radius:16px;background:var(--sw);box-shadow:0 0 0 1px rgba(0,0,0,.08) inset;position:relative}
.pal button.on::after{content:"";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--ck,#fff);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.tug{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tu{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--surf);border-radius:18px;padding:10px 10px 10px 12px;text-align:left;min-width:0}
.tu .h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tu .h i{font-style:normal;font-size:15px;display:inline-flex;width:24px;height:24px;border-radius:8px;background:var(--accSoft2);color:var(--accTxt);align-items:center;justify-content:center}
.tu .h em{font-style:normal;font-size:11px;font-weight:800;color:var(--accTxt);margin-left:auto}
.tu .v{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tu .v b{color:var(--ok);font-weight:800}
.tu .buy{margin-top:6px;padding:9px 8px;min-width:0;font-size:13px;border-radius:12px}
.tu.max .buy{background:var(--surf2);color:var(--mute)}
.float.crit{font-size:22px;color:#ff2d75;text-shadow:0 2px 10px rgba(255,45,117,.35)}
.tup{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;background:var(--surf);border-radius:20px;padding:10px 10px 10px 14px;text-align:left}
.tup .ti{font-size:22px}
.tup .tx{flex:1;min-width:0}.tup b{display:block;font-size:14.5px;font-weight:800}.tup small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.tup small em{font-style:normal;color:var(--ok);font-weight:800}
body::before{display:none;content:"";position:fixed;left:-20%;right:-20%;top:-180px;height:420px;background:radial-gradient(ellipse at 30% 50%,rgba(43,89,255,.10),transparent 60%),radial-gradient(ellipse at 80% 40%,rgba(155,92,255,.09),transparent 60%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
html{background:var(--pc,#fff)}
html,body{color:var(--ink);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
button *{pointer-events:none}
.buy,.cta,.qb,.claimbig,.openb,.synb,.chips button,.seg button,.mult button,.pick,.cand,.tm,.case,.free-t,.menu button,.skin,.srv,.num,.lk,.prow.opt,.evc .eb button{transition:transform .12s ease}
.buy:active,.cta:active,.qb:active,.claimbig:active,.openb:active,.synb:active,.chips button:active,.mult button:active,.cand:active,.tm:active,.case:active,.free-t:active,.menu button:active,.skin:active,.evc .eb button:active{transform:scale(.96)}
.pc .lv.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.45)}}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding-top:0;padding-bottom:calc(110px + var(--sb))}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--topbg);display:flex;align-items:center;gap:8px;padding:calc(10px + var(--st)) 16px 10px}
.logo{flex:1;font-weight:900;font-size:19px;letter-spacing:-.04em}
.logo span{color:var(--accTxt)}
.bchip{display:flex;align-items:center;gap:6px;background:var(--surf);border-radius:999px;padding:8px 12px 8px 8px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.bchip i{width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--accfg);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff7ac6,#9b5cff);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative}
.scr{display:none;padding:4px 16px 0}.scr.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;gap:10px}
.sh h3{font-size:23px;font-weight:900;letter-spacing:-.03em}
.sh small{font-size:12.5px;color:var(--mute);font-weight:600;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--surf);font-size:13.5px;font-weight:700;color:#5d636e;white-space:nowrap}
.chips button.on{background:var(--acc);color:var(--accfg)}
.seg{display:inline-flex;background:var(--surf);border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* code */
.hero{position:relative;overflow:hidden;margin-top:6px;border-radius:26px;padding:18px 18px 16px;color:var(--herofg);background:var(--hero);box-shadow:0 18px 40px -20px rgba(70,30,170,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.hero::after{width:180px;height:180px;left:-60px;bottom:-110px;background:radial-gradient(circle,rgba(123,77,255,.25),transparent 65%)}
.hero>*{position:relative;z-index:1}
.hero small{font-size:12.5px;font-weight:600;opacity:.75}
.hero #bal{display:block;font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.hero .pills{margin-top:12px}
.hero .pill{background:var(--pillbg,rgba(255,255,255,.16));color:var(--pillfg,rgba(255,255,255,.8))}
.hero .pill b{color:var(--herofg)}
.hero .pill.x{background:#efe8ff;color:#5a2fd9}.hero .pill.x b{color:#3b1d9a}
.fxchip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:5px 10px 5px 8px;font-size:12.5px;font-weight:800;animation:pin .3s cubic-bezier(.2,1.5,.4,1)}
.fxchip em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--mute);font-weight:700}
.fxchip.bad{background:#ffe8e6;color:#c4271c}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.bal{margin-top:6px}
.bal small{font-size:12.5px;color:var(--mute);font-weight:600}
.bal b{display:block;font-size:42px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{background:var(--surf);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mute);font-weight:600}
.pill b{color:var(--ink)}
.pill.x{background:#fff3e6;color:#b86a00}.pill.x b{color:#b86a00}
.term{--tb:#1a1433;--tt:#efeaff;--tp:#b59bff;--tg:#3d3561;--tc:#9b7bff;--tk:#2a2250;--tbar:#9b7bff;--tm:#9a91c2;--tchip:#262048;position:relative;overflow:hidden;background:var(--tb);color:var(--tt);border-radius:24px;padding:14px 16px 16px;margin-top:16px}
.term>*{position:relative;z-index:1}
.sk-matrix{--tb:#020b05;--tt:#4dff88;--tp:#00ff66;--tg:#124a24;--tc:#00ff66;--tk:#0a2412;--tbar:#00ff66;--tm:#2f9e58;--tchip:#06200f}
.sk-matrix .prompt{text-shadow:0 0 8px rgba(0,255,102,.55)}
.sk-amber{--tb:#140c02;--tt:#ffb347;--tp:#ffcf70;--tg:#4a3210;--tc:#ff9f1a;--tk:#2a1b06;--tbar:#ff9f1a;--tm:#a8742c;--tchip:#24170a}
.sk-amber .prompt{text-shadow:0 0 8px rgba(255,159,26,.5)}
.sk-matrix::after,.sk-amber::after{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.sk-synth{--tb:linear-gradient(160deg,#1a0b2e,#3b0d4f);--tt:#ffd6f6;--tp:#ff4fd8;--tg:#5e2a6e;--tc:#00e5ff;--tk:#2a0f3a;--tbar:linear-gradient(90deg,#ff4fd8,#00e5ff);--tm:#b07bc4;--tchip:#2a1240}
.sk-paper{--tb:#fbf8f1;--tt:#2b2a28;--tp:#c2410c;--tg:#d9d2c3;--tc:#c2410c;--tk:#ece5d6;--tbar:#c2410c;--tm:#8c8577;--tchip:#efe9dc;box-shadow:0 0 0 1px #e8e1d1 inset}
.sk-ocean{--tb:linear-gradient(160deg,#031a2b,#06344f);--tt:#bfeaff;--tp:#3fd0ff;--tg:#174d6b;--tc:#3fd0ff;--tk:#0a2a40;--tbar:linear-gradient(90deg,#3fd0ff,#5af2c7);--tm:#5e9bbd;--tchip:#0a2a40}
.sk-gold{--tb:linear-gradient(160deg,#16120a,#2a210b);--tt:#ffe7a3;--tp:#ffc93c;--tg:#4a3d14;--tc:#ffc93c;--tk:#2c2410;--tbar:linear-gradient(90deg,#ffe07a,#ff9f1a);--tm:#b39a55;--tchip:#2c2410;box-shadow:0 0 0 2px #e0a92b inset,0 12px 30px -12px rgba(255,170,30,.6)}
.sk-holo{--tb:linear-gradient(120deg,#1b1035,#0d2a3a,#2a0d2e,#1b1035);--tt:#f2ecff;--tp:#9bf3ff;--tg:#3f3a5c;--tc:#ff5cc8;--tk:#241d3d;--tbar:linear-gradient(90deg,#ff5c9a,#ffc24d,#36d9a0,#4d74ff);--tm:#9a92c2;--tchip:#2b2348;background-size:300% 300%;animation:holo 8s ease infinite}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.skin{border-radius:18px;background:var(--surf);padding:8px;text-align:left;position:relative}
.skin.on{box-shadow:0 0 0 2px var(--acc) inset}
.skin .term{margin:0;padding:10px 10px 12px;border-radius:12px}
.skin .term .prompt{font-size:12px;min-height:0;margin:0}
.skin .term .pb{margin-top:8px}
.skin b{display:block;font-size:13px;font-weight:800;margin:8px 2px 0}
.skin small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin:1px 2px 2px}
.skin.lock .term{filter:grayscale(1);opacity:.35}
.skin.lock small{color:#b0b5be}
.term .who{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.term .who .mini{width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center}
.term .who .mini .ic{width:100%}
.term .who .nm{flex:1;min-width:0}
.term .who b{display:block;font-size:14.5px;color:var(--tt)}.term .who small{font-size:12px;color:var(--tm)}
.term .who .chg{font-size:12px;color:var(--tm);background:var(--tchip);border-radius:999px;padding:6px 10px}
.prompt{font-family:var(--mono);font-size:16px;line-height:1.5;margin-top:14px;min-height:72px;word-break:break-word}
.prompt .gh{color:var(--tg)}.prompt .pr{color:var(--tp)}
.skins .caret,.skins .sk-holo,.skins .sk-holo *{animation:none!important}
.caret{display:inline-block;width:9px;height:18px;background:var(--tc,var(--acc));vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pb{height:3px;background:var(--tk);border-radius:3px;margin-top:12px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--tbar);transition:width .12s}
.tok{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--tm)}
.tok b{color:var(--tt);font-weight:700}
.tok .tb{flex:1;height:6px;border-radius:6px;background:var(--tk);overflow:hidden}
.tok .tb i{display:block;height:100%;background:var(--tbar);border-radius:6px;transition:width .15s}
.tok.low .tb i{background:#ff3b30}.tok.low b{color:#ff6b61}
.tap.empty{filter:saturate(.3);opacity:.75}
.done{position:absolute!important;right:16px;bottom:46px;font-family:var(--mono);font-size:12px;color:var(--tp);opacity:0;transition:opacity .2s}
.done.show{opacity:1}
.tap{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:22px;border-radius:22px;background:var(--tapbg);color:var(--tapfg);font-size:18px;font-weight:800;box-shadow:var(--tapsh);transition:transform .07s;touch-action:manipulation}
.tap small{font-weight:700;opacity:.8;font-size:14px}
.tap:active{transform:scale(.98)}
.tap>*{position:relative;z-index:1}
.rip{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:currentColor;opacity:.3;pointer-events:none;animation:rip .55s ease-out forwards;z-index:0}
@keyframes rip{to{transform:scale(9);opacity:0}}
.tap.hack{background:linear-gradient(90deg,#ff7a1a,#ff2d75,#9b5cff);background-size:200% 100%;animation:hk 1.2s linear infinite}
@keyframes hk{to{background-position:200% 0}}
.float.big{font-size:20px;color:#9b5cff}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:16px;color:var(--accTxt);animation:fl .9s ease-out forwards;z-index:50}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.team{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.team::-webkit-scrollbar{display:none}
.tm{flex:0 0 112px;border-radius:20px;overflow:hidden;text-align:left;position:relative}
.tm .art{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.tm .meta{padding:0 10px 10px;position:relative;z-index:5}
.tm b{display:block;font-size:12px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm small{font-size:11px;font-weight:800;color:var(--ok)}
.empty-team{background:var(--surf);border-radius:20px;padding:16px;font-size:13.5px;color:var(--mute);line-height:1.4}
.hint{margin-top:12px;font-size:13.5px;color:var(--mute);line-height:1.45}

/* rarity cards */
.card{position:relative;border-radius:22px;overflow:hidden;text-align:left;isolation:isolate;display:block;width:100%}
.card .art{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.card .meta{position:relative;z-index:5;padding:0 12px 12px}
.card .nm{font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rr{font-size:11.5px;font-weight:700;margin-top:2px;opacity:.8}
.card.sm .nm{font-size:12px}.card.sm .meta{padding:0 9px 9px}.card.sm .rr{font-size:10.5px}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--k);z-index:6}
.card .badge{position:absolute;top:9px;left:9px;z-index:7;max-width:calc(100% - 18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.8);backdrop-filter:blur(6px)}
.card .badge.new{background:var(--acc);color:var(--accfg)}
.card .pct{position:absolute;top:9px;right:9px;z-index:7;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.8);border-radius:999px;padding:3px 7px}
.card .lvd{display:flex;gap:3px;margin-top:5px}
.card .lvd i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.12)}
.card .lvd i.on{background:var(--ink)}
.card.lock{background:var(--surf)}.card.lock .nm{color:#b0b5be}
.t-c{background:linear-gradient(160deg,#f6f7f9,#e3e6ec)}
.t-r{background:linear-gradient(160deg,#eef7ff,#c3e2ff)}
.t-e{background:linear-gradient(160deg,#f5eeff,#d8c3ff)}
.t-l{background:linear-gradient(160deg,#fff7e3,#ffd98c)}
.t-m{background:linear-gradient(130deg,#ffd9ea,#e5dbff 35%,#d4f4ff 65%,#fff0c4);background-size:220% 220%;}
@keyframes holo{50%{background-position:100% 100%}}
.t-c .rr{color:#6b7280}.t-r .rr{color:#0a6fd1}.t-e .rr{color:#6a2ee0}.t-l .rr{color:#b86a00}.t-m .rr{color:#d1145a}

/* icon art */
.ic{position:relative;width:76%;aspect-ratio:1/1;container-type:inline-size;display:flex}
.ic img{position:relative;z-index:1;width:100%;height:100%;border-radius:23%;box-shadow:0 8px 18px -8px rgba(0,0,0,.45);-webkit-user-drag:none;pointer-events:none}
.ic.r-c{--k:#9aa1ad}.ic.r-r{--k:#1f9bff}.ic.r-e{--k:#9b5cff}.ic.r-l{--k:#ffa514}.ic.r-m{--k:#ff2d75}
.ic.r-e img{box-shadow:0 0 0 2.5px #b48cff,0 8px 22px -8px rgba(155,92,255,.8)}
.ic.r-l img{box-shadow:0 0 0 3px #ffc04d,0 10px 26px -6px rgba(255,165,20,.8)}
.ic.r-m img{box-shadow:0 0 0 3px #ff5c9a,0 10px 28px -6px rgba(255,45,117,.85)}
.ic.r-l::after,.ic.r-m::after{content:"";position:absolute;inset:0;z-index:2;border-radius:23%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:260% 100%;pointer-events:none;opacity:0}
.res .ic.r-l::after,.res .ic.r-m::after{opacity:1;animation:shine 3s infinite}
@keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-110% 0}}
.ic-glow{position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,var(--k) 0,transparent 68%);opacity:.55;z-index:0}
.ic-rays{position:absolute;inset:-16%;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--k) 0 9deg,transparent 9deg 24deg);opacity:.32;z-index:0;-webkit-mask:radial-gradient(circle closest-side,#000 45%,transparent 100%);mask:radial-gradient(circle closest-side,#000 45%,transparent 100%);pointer-events:none}
.ic .ic-sp{position:absolute;left:-12%;top:-12%;width:124%;height:124%;z-index:3;overflow:visible;pointer-events:none}
.ic-v{position:absolute;z-index:4;right:-6%;bottom:-5%;background:#0e0f12;color:#fff;font-weight:800;font-size:max(9px,13cqw);line-height:1;padding:.35em .55em;border-radius:999px;white-space:nowrap;box-shadow:0 0 0 2px #fff}
.ic.lk img{filter:brightness(0);opacity:.12;box-shadow:none}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-.2em}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.twk{transform-box:fill-box;transform-origin:center}
.res .twk,.ov .twk{animation:twk 1.8s ease-in-out infinite}
.res .ic-rays{animation:spin 14s linear infinite}
@keyframes twk{50%{opacity:.2;transform:scale(.5)}}
.bob{}
@keyframes bob{50%{transform:translateY(-3px)}}

/* projects */
.auto{display:flex;align-items:center;gap:12px;background:var(--accSoft);border-radius:20px;padding:12px 14px;width:100%;text-align:left}
.auto b{display:block;font-size:14.5px;font-weight:800}
.auto:active{transform:scale(.98)}.auto.hot .autoGo{animation:qpulse 1.6s ease-in-out 4}.autoGo{flex:none;padding:9px 14px;border-radius:999px;background:var(--acc);color:var(--accfg);font-weight:800;font-size:13.5px}
.auto small{font-size:12.5px;color:#4b5a86;line-height:1.35;display:block;margin-top:1px}
.sw{flex:0 0 46px;height:28px;border-radius:999px;background:var(--acc);position:relative;transition:background .2s;color:var(--accfg)}
.sw::after{content:"";position:absolute;top:3px;left:21px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.off{background:#c9ced8}.sw.off::after{left:3px}
.pc{display:flex;gap:12px;background:var(--surf);border-radius:22px;padding:12px;margin-top:10px;align-items:center}
.pc.lock{opacity:.45}
.pc .ai{position:relative;flex:0 0 72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.pc .ai .ic{width:88%}
.pc .ai.empty{border:2px dashed #c9ced8;font-size:12px;font-weight:800;color:var(--mute);text-align:center;line-height:1.15}
.pc .tx{flex:1;min-width:0}
.pc .tx b{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.pe{display:inline-flex;width:26px;height:26px;border-radius:9px;background:var(--accSoft2);color:var(--accTxt);align-items:center;justify-content:center;font-size:14px;margin-right:6px;vertical-align:-4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pc.bug{box-shadow:0 0 0 2px #ff3b30 inset;animation:bugp 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-iteration-count:1!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes bugp{50%{box-shadow:0 0 0 2px rgba(255,59,48,.3) inset}}
.pc .tx .lv{font-size:11.5px;font-weight:800;color:var(--accTxt);margin-left:5px;white-space:nowrap}
.pc .tx .inc{font-size:13px;color:var(--mute);font-weight:600;margin-top:2px}
.pc .tx .inc b{font-size:13px;color:var(--ink)}
.boost{display:inline-block;max-width:100%;margin-top:5px;font-size:11.5px;font-weight:800;color:var(--ok);background:#e3f7ec;border-radius:999px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boost.no{color:#8b909a;background:#e8eaef}
.ms{height:3px;background:var(--surf2);border-radius:3px;margin-top:7px;overflow:hidden;width:90%}.ms i{display:block;height:100%;background:var(--ink)}
.buy{padding:12px 12px;border-radius:15px;background:var(--acc);color:var(--accfg);font-weight:800;font-size:14px;white-space:nowrap;text-align:center;line-height:1.1;min-width:82px}
.buy small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:2px}
.buy:disabled{background:var(--surf2);color:#a6abb5}
.burn{position:relative;display:block;width:100%;text-align:left;margin-top:16px;border-radius:24px;padding:18px;background:#0e0f12;color:#fff;overflow:hidden}
.burn::before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,61,.55),transparent 70%)}
.burn>*{position:relative}
.bi{display:inline-flex;margin-right:6px;color:#ff8a3d}
.burn b{display:flex;align-items:center;font-size:18px;font-weight:900;letter-spacing:-.02em}
.burn p{font-size:13px;color:#9ba0aa;margin-top:4px;line-height:1.4}
.burn .bar{height:6px;border-radius:6px;background:#24262d;margin-top:12px;overflow:hidden}
.burn .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ffb020,#ff3d3d)}
.burn.ready{box-shadow:0 0 0 2px #ff6a3d,0 12px 30px -10px rgba(255,106,61,.7)}

/* cases */

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.case .art{aspect-ratio:1/1.02;display:flex;align-items:center;justify-content:center}
.case .art img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}

.sale{position:absolute;top:10px;right:10px;z-index:2;background:#ff2d75;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:4px 8px}

.case .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 12px 12px}

.cfree{background:linear-gradient(160deg,#f6f7f9,#e4e7ed)}

/* collection */

.burnc .go{display:block;width:100%;margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(90deg,#ffb020,#ff3d3d);color:#fff;font-weight:800;font-size:16px}

.tbon{color:var(--ok);font-weight:900;font-size:15px}.tinv{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:var(--acc);color:var(--accfg);font-weight:800;font-size:14.5px}.tinv:disabled{background:var(--surf2);color:var(--mute)}.tleave{display:block;margin:8px auto 0;font-size:12.5px;font-weight:700;color:var(--mute);text-decoration:underline}.tleave[hidden]{display:none}.tr.emp .ta{background:transparent;border:2px dashed var(--line)}.tr.emp .tn{color:var(--mute);font-weight:600}

.menu button[hidden]{display:none}
.adm h4{margin:18px 0 6px;font-size:14px;font-weight:800}

const fxOn=k=>!!(S.fx[k]&&S.fx[k].until>Date.now());

 pow:{i:'bolt',k:'tuPow',get max(){return Math.max(tuL('pow'),Math.min(BAL.tu.pow[2],BAL.powCap0+BAL.powCapB*(S.burns||0)));},cost:l=>BAL.tu.pow[0]*Math.pow(BAL.tu.pow[1],l)},

/* ================= ASSIGN ================= */
function autoAssign(){
  const slots=openSlots();
  const w=s=>s==='terminal'?tapBase(S.tu.pow||0)*G()*3:baseInc(PB[s]);
  slots.sort((a,b)=>w(b)-w(a));
  const ns={},used=new Set();
  slots.forEach(s=>{let best=null,bg=0;Object.keys(S.owned).forEach(id=>{if(used.has(id))return;const g=gainOf(id,s);if(g>bg){bg=g;best=id;}});if(best){ns[s]=best;used.add(best);}});
  const val=sl=>Object.entries(sl).reduce((a,[k,id])=>a+w(k)*(power(id,k)*SETM(Object.values(sl).filter(x=>MB[x].b&&MB[x].b===MB[id].b).length)-1),0);
  let cur=ns,cv=val(cur);const ids=Object.keys(S.owned);
  for(let it=0;it<4;it++){let imp=false;
    for(const k of slots)for(const id of ids){if(cur[k]===id)continue;const tt={...cur};Object.keys(tt).forEach(x=>{if(tt[x]===id)delete tt[x];});tt[k]=id;const v=val(tt);if(v>cv+1e-9){cur=tt;cv=v;imp=true;}}
    if(!imp)break;}
  S.slots=cur;
}
function assign(slot,id){
  S.auto=false;
  Object.keys(S.slots).forEach(k=>{if(S.slots[k]===id)delete S.slots[k];});
  if(id)S.slots[slot]=id;else delete S.slots[slot];
  haptic('medium');save();closeS();renderAll();autoHint();
}
function changed(){setTimeout(autoHint,0);
  const used=new Set(Object.values(S.slots));const empty=openSlots().filter(k=>!S.slots[k]);if(!empty.length)return;
  const w=s=>s==='terminal'?tapBase(S.tu.pow||0)*G()*3:baseInc(PB[s]);empty.sort((a,b)=>w(b)-w(a));
  empty.forEach(k=>{let best=null,bg=0;Object.keys(S.owned).forEach(id=>{if(used.has(id))return;const g=gainOf(id,k);if(g>bg){bg=g;best=id;}});if(best){S.slots[k]=best;used.add(best);}});
}
function autoHint(){const el=$('autoBtn');if(!el)return;const keep=S.slots,b=income();S.slots={...keep};autoAssign();const v=income();S.slots=keep;el.classList.toggle('hot',v>b*1.01);}

function tap(e){
  tokRegen(0);
  if(S.tok<1){sfx('err');const d=$('done');d.textContent=t('limitOut');d.classList.add('show');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('show'),1100);shake($('tok'));return;}
  S.tok-=1;sfx('tap');
  const isCrit=Math.random()<critCh(tuL('crit'));if(isCrit)S.crits=(S.crits||0)+1;
  const v=tapVal()*(isCrit?BAL.critMul:1);earn(v);S.taps++;S.pc+=CPT;
  if(S.pc>=curPrompt().length){const b=v*BAL.promptBonus;earn(b);S.prompts++;S.pi++;S.pc=0;evPrompt();qAdd('prompts',1);sfx('prompt');const d=$('done');d.textContent=t('sentOk')+' +$'+fmt(b);d.classList.add('show');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('show'),1100);haptic('medium');}

/* ---------- celebration particles ---------- */
function celebrate(r){
  const id=++fxRun;
  const cv=document.createElement('canvas');cv.className='fxc';ov.prepend(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr;
  const ctx=cv.getContext('2d');
  const CFG={
    c:{cols:['#ffffff','#d5d9e0','#aab1bd'],float:22,size:[1.5,3.5]},
    r:{cols:['#ffffff','#9fd6ff','#1f9bff'],float:46,size:[1.5,4],star:true},
    e:{cols:['#ffffff','#d6c2ff','#9b5cff','#c48bff'],float:55,size:[1.5,4.5],star:true,orbit:46,bursts:1},
    l:{cols:['#fff6d6','#ffd54d','#ffa514','#ffffff','#ffc04d'],float:50,size:[2,5],star:true,orbit:40,bursts:3,confetti:120},
    m:{cols:['#ff2d75','#ffb020','#36d9a0','#4d74ff','#b48cff','#ffffff','#ff7ac6'],float:60,size:[2,5.5],star:true,orbit:60,bursts:6,confetti:200,stream:true}
  }[r];
  const P=[],rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],cx=W/2,cy=H*.42;
  const flt=(init)=>P.push({t:'f',x:rnd(0,W),y:init?rnd(0,H):H+rnd(0,40*dpr),vx:rnd(-.25,.25)*dpr,vy:-rnd(.3,1.3)*dpr,s:rnd(...CFG.size)*dpr,c:pick(CFG.cols),ph:rnd(0,6.28)});
  for(let i=0;i<CFG.float;i++)flt(true);
  for(let i=0;i<(CFG.orbit||0);i++)P.push({t:'o',a:rnd(0,6.28),rad:rnd(110,190)*dpr,va:rnd(.006,.02)*(Math.random()<.5?-1:1),s:rnd(1.5,3.5)*dpr,c:pick(CFG.cols),ph:rnd(0,6.28)});
  const burst=(x,y)=>{const n=70;for(let i=0;i<n;i++){const a=i/n*6.28+rnd(-.05,.05),sp=rnd(2,7)*dpr;P.push({t:'b',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:rnd(1.5,3.2)*dpr,c:pick(CFG.cols),life:1,dc:rnd(.009,.016)});}if(id===fxRun)haptic('light');};
  const conf=n=>{for(let i=0;i<n;i++)P.push({t:'c',x:rnd(0,W),y:rnd(-H*.7,-10),vx:rnd(-1,1)*dpr,vy:rnd(1.8,4)*dpr,w:rnd(5,10)*dpr,h:rnd(9,16)*dpr,rot:rnd(0,6.28),vr:rnd(-.15,.15),c:pick(CFG.cols),sw:rnd(0,6.28)});};
  for(let k=0;k<(CFG.bursts||0);k++)setTimeout(()=>{if(id===fxRun)burst(cx+rnd(-W*.32,W*.32),cy+rnd(-H*.28,H*.12));},120+k*380);
  if(CFG.confetti)conf(CFG.confetti);
  if(CFG.stream){let k=0;const iv=setInterval(()=>{if(id!==fxRun||++k>10){clearInterval(iv);return;}conf(18);},450);}
  const star=(x,y,s)=>{ctx.beginPath();ctx.moveTo(x,y-s*2);ctx.quadraticCurveTo(x,y,x+s*2,y);ctx.quadraticCurveTo(x,y,x,y+s*2);ctx.quadraticCurveTo(x,y,x-s*2,y);ctx.quadraticCurveTo(x,y,x,y-s*2);ctx.fill();};
  let tt=0;
  (function frame(){
    if(id!==fxRun||!ov.classList.contains('on'))return;
    tt+=1;ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){const p=P[i];
      if(p.t==='f'){p.x+=p.vx;p.y+=p.vy;if(p.y<-20){P.splice(i,1);flt(false);continue;}ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35+.35*Math.sin(p.ph+tt*.08);ctx.fillStyle=p.c;if(CFG.star&&p.s>3*dpr)star(p.x,p.y,p.s*.6);else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.28);ctx.fill();}}
      else if(p.t==='o'){p.a+=p.va;const x=cx+Math.cos(p.a)*p.rad,y=cy+Math.sin(p.a)*p.rad*.75;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.4+.4*Math.sin(p.ph+tt*.1);ctx.fillStyle=p.c;star(x,y,p.s*.7);}
      else if(p.t==='b'){p.vx*=.965;p.vy=p.vy*.965+.05*dpr;p.x+=p.vx;p.y+=p.vy;p.life-=p.dc;if(p.life<=0){P.splice(i,1);continue;}ctx.globalCompositeOperation='lighter';ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.28);ctx.fill();}
      else if(p.t==='c'){p.sw+=.05;p.x+=p.vx+Math.sin(p.sw)*.8*dpr;p.y+=p.vy;p.rot+=p.vr;if(p.y>H+30){P.splice(i,1);continue;}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.95;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.sw*2));ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
    }
    ctx.globalAlpha=1;requestAnimationFrame(frame);
  })();
}

function syData(){const o={...S};o.fb=(S.fb||[]).slice(-20);return JSON.stringify(o);}
function renderSync(){const v=$('syncV');if(!v)return;
  setTx(v,!lbOk()?t('syncOff'):SY.busy?t('syncWait'):SY.state==='ok'?t('syncOk')+' '+new Date(SY.at).toTimeString().slice(0,5):SY.state==='err'?t('syncErr'):'');}
function syPush(mode){
  if(!lbOk()||SY.busy||SY.kicked||(SY.conflict&&mode!=='force'))return Promise.resolve();
  if(!mode&&S.syncAt&&S.played-(S.syncPlayed||0)<1)return Promise.resolve();
  SY.busy=true;renderSync();S.srev=Date.now().toString(36)+Math.random().toString(36).slice(2,7);save();const played=S.played;
  const body=JSON.stringify({init:tg.initData,sid:SID,base:S.syncAt||0,force:mode==='force',data:syData()});
  return fetch(API+'/save',{method:'POST',body,keepalive:body.length<60000,headers:{'Content-Type':'text/plain'}})
    .then(r=>r.json().then(d=>({st:r.status,d})))
    .then(({st,d})=>{if(st===423){kicked();return;}if(st===409){setTimeout(()=>syCheck(),50);return;}if(!d.at)throw 0;S.syncAt=d.at;S.syncPlayed=played;SY.state='ok';SY.at=Date.now();SY.conflict=false;save();})
    .catch(()=>{SY.state='err';}).finally(()=>{SY.busy=false;renderSync();});
}
function syApply(c){
  let o;try{o=JSON.parse(c.data);}catch(e){return;}
  o.syncAt=c.at;o.syncPlayed=o.played||0;if(UID)o.uid=UID;o.syncNote=1;if(o._adm)o._admSeen=o._adm;
  window.__noSave=true;try{localStorage.setItem(UKEY,JSON.stringify(o));}catch(e){}
  location.reload();
}
function syFetch(){return fetch(API+'/save',{headers:{'X-Init-Data':tg.initData}}).then(r=>r.json()).then(c=>{if(c.error)throw 0;return c;});}
function syCheck(){
  if(!lbOk()||SY.busy||SY.conflict||SY.kicked)return;SY.chk=Date.now();
  SY.busy=true;renderSync();
  syFetch().then(c=>{SY.busy=false;
    if(!c.at){if(S.total>0||S.burns>0)syPush('now');else{SY.state='ok';SY.at=Date.now();}return;}
    let cd={};try{cd=JSON.parse(c.data)||{};}catch(e){}
    if(cd._adm&&cd._adm!==S._admSeen){syApply(c);return;}
    // в облаке то, что отправило это же устройство (ответ мог не дойти при закрытии игры)
    if(c.at===S.syncAt||(cd.srev&&cd.srev===S.srev)){S.syncAt=c.at;SY.state='ok';SY.at=Date.now();save();syPush();return;}
    const real=hadLocal&&(S.total>0||S.burns>0);
    const changed=real&&(!S.syncAt||S.played-(S.syncPlayed||0)>15);
    if(!changed){syApply(c);return;}
    // прогресс разошёлся (играли на двух устройствах) — без вопросов оставляем тот, где больше выгораний, затем денег
    const cb=cd.burns||0,lb=S.burns||0,cloudBetter=cb>lb||(cb===lb&&(cd.total||0)>(S.total||0));
    if(cloudBetter)syApply(c);else{S.syncAt=c.at;syPush('force');}
  }).catch(()=>{SY.busy=false;SY.state='err';}).finally(renderSync);
}

  let canP=false;const showP=curView==='proj';
  PROJECTS.forEach(p=>{
    const r=pref[p.id];if(!r)return;
    const l=lv(p),unl=!r.prev||lv(r.prev)>0;
    const n=bulkN(p),c=costN(p,n),ok=unl&&S.money>=c;if(ok)canP=true;
    if(!showP&&r.k!==undefined)return;
    const id=S.slots[p.id],m=id&&MB[id]&&l?MB[id]:null;
    r.el.classList.toggle('lock',!unl);
    r.el.classList.toggle('bug',fxOn('bug')&&S.fx.bug.p===p.id);
    const key=(l>0)+'|'+(m?m.id+S.owned[m.id].lvl:'');
    if(r.k!==key){r.k=key;r.ai.className='ai'+(m?'':' empty');r.ai.innerHTML=m?art(m):(l?t('addAi'):I('lock'));}
    setTx(r.lv,l?t('lvl')+' '+l:'');
    const ih=l?`<b>$${fmt(projInc(p))}${t('perS')}</b> · ${p.tags.map(x=>SPEC[x][L()]).join(', ')}`:p.tags.map(x=>SPEC[x][L()]).join(', ');if(r.ih!==ih){r.ih=ih;r.inc.innerHTML=ih;}
    r.boost.classList.toggle('no',!m);setSt(r.boost,'display',l?'':'none');
    {const sm=m?setMultFor(m.id,S.slots):1;setTx(r.boost,m?`${m.name} · +$${fmt(gainOf(m.id,p.id))}${t('perS')}${sm>1?' · '+t('setW')+' +'+Math.round((sm-1)*100)+'%':''}`:t('noModel'));}
    const nx=MILES.find(x=>x>l),pm=[...MILES].reverse().find(x=>x<=l)||0;
    setSt(r.ms,'width',nx?((l-pm)/(nx-pm)*100)+'%':'100%');setSt(r.ms.parentElement,'display',l?'':'none');
    if(r.buy.disabled!==!ok)r.buy.disabled=!ok;const bh=`$${fmt(c)}<small>×${n}</small>`;if(r.bh!==bh){r.bh=bh;r.buy.innerHTML=bh;}
  });
  const bReady=canBurn();
  $('burnBanner').classList.toggle('ready',bReady);
  if(showP){setTx($('burnText'),bReady?t('burnReady').replace('{x}',xpGain()):t('burnBanner').replace('{m}',fmt(BURN_MIN())).replace('{p}',burnReq().p));
  setSt($('burnBar'),'width',Math.min(100,Math.round(Math.min(1,op/burnReq().p)*50+Math.min(1,S.run/BURN_MIN())*50))+'%');}

  const now=Date.now(),freeOk=now>=S.freeAt;
  {const fr=$('freeR'),cls=freeOk?'go':'tmr';let tx=t('open');if(!freeOk){const s=Math.ceil((S.freeAt-now)/1000);tx=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}if(fr.className!==cls)fr.className=cls;$('freeCard').classList.toggle('ready',freeOk);if(fr.textContent!==tx)fr.textContent=tx;}

  if(curView==='case')updOpen();
  $('dotProj').classList.toggle('show',canP&&curView!=='proj');
  $('dotCases').classList.toggle('show',freeOk&&curView!=='cases'&&curView!=='case');
  $('dotBook').classList.toggle('show',Object.values(S.owned).some(o=>o.new));
  $('dotMe').classList.toggle('show',bReady&&curView!=='me');
  if(curView==='me'&&(update._m=(update._m||0)+1)%4===0)renderMe();
  if(!update._g||Date.now()-update._g>1000){update._g=Date.now();$('dotGoals').classList.toggle('show',curView!=='goals'&&goalsClaimable());if(curView==='goals'){const ms=864e5-((Date.now()-new Date().getTimezoneOffset()*60000)%864e5);$('gReset').textContent=t('newIn')+' '+Math.floor(ms/36e5)+':'+String(Math.floor(ms/6e4)%60).padStart(2,'0');const sg=goalsSig();if(qDirty||sg!==update._gs){update._gs=sg;renderGoals();}}}
}
function renderAll(){renderSync();renderTeamC();$('sndV').textContent=S.snd===false?t('off'):t('on');renderSets();$('burnI1').innerHTML=I('flame');$('burnI2').innerHTML=I('flame');$('starI').innerHTML=I('star');applyTheme();renderTU();renderSkins();renderTerm();renderTeam();renderProjects();renderCases();renderBook();renderMe();renderTop();renderPrompt();update();}
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  renderAll();
}
function go(v){
  curView=v;if(v==='me'){lbLoad();tmLoad();}
  document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+v));
  const nv=v==='case'?'cases':v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===nv));
  if(v==='book'){renderBook();renderSets();}if(v==='proj')renderSets();if(v==='goals')renderGoals();if(v==='code'){renderTerm();renderTeam();}if(v==='me')renderMe();
  haptic('light');update();scrollTo(0,0);
}

/* ================= OFFLINE / LOOP ================= */
function offline(){
  const dt=Math.min(OFFLINE_CAP,(Date.now()-S.last)/1000),inc=income();tokRegen(Math.max(0,dt));
  if(dt>60&&inc>0){const e=inc*dt*BAL.offRate;earn(e);openS(`<h3>${t('offT')}</h3><p class="sub">${t('offP')} · ${dur(dt)}</p><div class="big">+$${fmt(e)}</div><p class="proto">${t('offMax')}</p><button class="cta" id="ok">${t('collect')}</button>`);$('ok').onclick=()=>{haptic('ok');closeS();};}
}
let lastT=performance.now(),acc=0;
let dispBal=null;
function loop(){const now=performance.now(),dt=Math.min(1,(now-lastT)/1000);lastT=now;if(document.hidden)return;
  {if(dispBal==null)dispBal=S.money;const d=S.money-dispBal;dispBal=Math.abs(d)<Math.max(.5,Math.abs(S.money)*.002)?S.money:dispBal+d*Math.min(1,dt*9);const f=fmt(Math.max(0,dispBal));if(loop._f!==f){loop._f=f;$('hdrBal').textContent=f;$('bal').textContent='$'+f;}}tokRegen(dt);earn(income()*dt);S.played+=dt;acc+=dt;if(acc>=.25){acc=0;update();}}
setInterval(()=>{if(!document.hidden)save();},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();lastT=performance.now();update();}});
addEventListener('pagehide',save);

changed();
[...new Set(MODELS.map(m=>m.f))].forEach(f=>{const i=new Image();i.src=''+f+'.webp';});CASES.forEach(c=>{const i=new Image();i.src=''+c.img+'.webp';});
applyLang();offline();setTimeout(dailyPopup,600);if(S.balNote){S.balNote=false;save();setTimeout(()=>evToast(I('refresh'),t('balNote'),'good'),1800);}setInterval(loop,100);
})();
</script>
